AWSTemplateFormatVersion: '2010-09-09'
Description: JWT-authenticated, read-only staging S3 receipts for existing StockLens Cognito portal; never touches stocklens-paper or broker.
Parameters:
  PortalApiId:
    Type: String
    AllowedPattern: '[a-zA-Z0-9]+'
    Description: Existing authenticated HTTP API ID (not URL).
  PortalAuthorizerId:
    Type: String
    AllowedPattern: '[a-zA-Z0-9]+'
    Description: Existing Cognito JWT authorizer ID in that same API.
  StagingDataBucket:
    Type: String
    AllowedPattern: 'stocklens-independent-staging-[a-z0-9-]+'
    Description: Actual private/versioned independent Staging data bucket.
Resources:
  StagingPortalReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: StagingReceiptsS3GetOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${StagingDataBucket}/signals/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${StagingDataBucket}/paper/sessions/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${StagingDataBucket}/paper/continuity/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${StagingDataBucket}'
  StagingPortalReadLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt StagingPortalReadRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          STAGING_DATA_BUCKET: !Ref StagingDataBucket
      Code:
        ZipFile: |
          """Pure verifier for private AWS staging S3 read-side portal summaries.
          
          No writes, broker, API permissions, or authentication logic here; route-level
          Cognito JWT MUST be enforced by API Gateway. A GetObject returns immutable
          object bytes + the S3 server LastModified/version metadata. These summaries
          are NOT a replacement for independent full-chain Paper verification.
          """
          import hashlib
          import json
          from datetime import date
          
          MAX_BODY=2_000_000
          AUDIT_PASS="PASS_MODELLED_PAPER_ACCOUNTING_NOT_BROKER_FILLS"
          
          def verified_body(raw:bytes,version_id:str,saved_at_utc:str):
              if not version_id or version_id=="null" or not saved_at_utc:
                  raise ValueError("UNVERSIONED_OR_UNTIMED_S3_RECEIPT")
              if len(raw)>MAX_BODY:
                  raise ValueError("STAGING_RECEIPT_TOO_LARGE")
              return json.loads(raw),{
                  "sha256":hashlib.sha256(raw).hexdigest(),
                  "version_id":version_id,
                  "saved_at_utc":saved_at_utc,
              }
          
          def summarize(day:str, get):
              """get(key)->None or (decoded evidence dict, metadata dict)."""
              try:
                  if date.fromisoformat(day).isoformat()!=day:
                      raise ValueError("BAD_SESSION_DATE")
                  sig=get("signals/"+day+".json")
                  paper=get("paper/sessions/"+day+".json")
                  continuity=get("paper/continuity/"+day+".json")
                  if not sig and not paper and not continuity:
                      return {"session_date":day,"status":"NO_STAGING_RECEIPT"}
                  if not sig:
                      raise ValueError("PAPER_WITHOUT_ARCHIVED_SIGNAL")
                  s, sm=sig
                  if (s.get("mode")!="SHADOW_ONLY_NO_BROKER_ACTIONS" or
                      s.get("latest",{}).get("asof_date")!=day or
                      s.get("execution_plan",{}).get("broker_actions_enabled") is not False):
                      raise ValueError("INVALID_STAGED_FROZEN_SIGNAL")
                  result={"session_date":day,"status":"SIGNAL_S3_VERSIONED",
                          "signal":{"level":s["latest"].get("level"),
                                    "target_leverage":s["latest"].get("target_leverage"),**sm}}
                  if paper or continuity:
                      if not paper or not continuity:
                          raise ValueError("PAPER_OR_CONTINUITY_PARTIAL")
                      p,pm=paper
                      c,cm=continuity
                      if (p.get("session")!=day or
                          p.get("current_signal_sha256")!=sm["sha256"] or
                          p.get("broker_orders_authorized") is not False or
                          p.get("broker_fills_observed") is not False or
                          p.get("production_replacement_authorized") is not False or
                          p.get("integrity",{}).get("status")!=AUDIT_PASS or
                          c.get("session")!=day or
                          c.get("evidence",{}).get("paper_sha256")!=pm["sha256"]):
                          raise ValueError("S3_PAPER_CONTINUITY_BINDING_INVALID")
                      result["paper"]={"equity":p["row"].get("equity"),
                                       "trade_count":len(p.get("trades",[])),
                                       "continuity_status":c.get("status"),**pm}
                      result["status"]="SIGNAL_PAPER_CONTINUITY_S3_SHA_BOUND"
                  return result
              except (ValueError,TypeError,KeyError,json.JSONDecodeError):
                  return {"session_date":day,"status":"INVALID_EVIDENCE","signal":None,"paper":None}
          
          import os
          
          def require_days(raw):
              if not isinstance(raw,str) or not raw:
                  raise ValueError("MISSING_DATES")
              items=raw.split(",")
              if len(items)>14 or len(set(items))!=len(items):
                  raise ValueError("INVALID_OR_EXCESS_DATES")
              for d in items:
                  if not d.startswith("20") or date.fromisoformat(d).isoformat()!=d or d>date.today().isoformat():
                      raise ValueError("INVALID_OR_FUTURE_DATE")
              return sorted(items)
          
          def handler(event,context):
              def reply(status,payload):
                  return {"statusCode":status,"headers":{"content-type":"application/json","cache-control":"private, no-store"},
                          "body":json.dumps(payload,separators=(",",":"))}
              if event.get("requestContext",{}).get("http",{}).get("method")!="GET":
                  return reply(405,{"error":"GET_ONLY"})
              try:
                  days=require_days((event.get("queryStringParameters") or {}).get("dates"))
              except (ValueError,TypeError):
                  return reply(400,{"error":"INVALID_DATES"})
              import boto3
              client=boto3.client("s3")
              bucket=os.environ["STAGING_DATA_BUCKET"]
              def get(key):
                  try:
                      r=client.get_object(Bucket=bucket,Key=key)
                  except Exception as exc:
                      code=getattr(exc,"response",{}).get("Error",{}).get("Code")
                      if code in ("NoSuchKey","404","NotFound"):
                          return None
                      raise
                  t=r.get("LastModified")
                  if t is None or t.tzinfo is None:
                      raise ValueError("NO_S3_SERVER_TIMESTAMP")
                  return verified_body(r["Body"].read(MAX_BODY+1),r.get("VersionId"),t.isoformat())
              try:
                  rows=[summarize(day,get) for day in days]
              except Exception:
                  return reply(503,{"error":"STAGING_SOURCE_UNAVAILABLE"})
              return reply(200,{"kind":"STOCKLENS_AUTHENTICATED_STAGING_S3_READ_ONLY",
                  "source":"PRIVATE_VERSIONED_STAGING_S3","sessions":rows,
                  "broker_orders_authorized":False,"broker_fills_observed":False,
                  "full_chain_verified_by_portal":False,"production_cutover_authorized":False})
  StagingPortalIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PortalApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StagingPortalReadLambda.Arn
      PayloadFormatVersion: '2.0'
  StagingPortalRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PortalApiId
      RouteKey: GET /v1/staging
      AuthorizationType: JWT
      AuthorizerId: !Ref PortalAuthorizerId
      Target: !Join ['', ['integrations/', !Ref StagingPortalIntegration]]
  AllowStagingPortalApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StagingPortalReadLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PortalApiId}/*/GET/v1/staging'
Outputs:
  StagingReadLambdaName:
    Value: !Ref StagingPortalReadLambda
  PortalApiId:
    Value: !Ref PortalApiId
  StagingApiPath:
    Value: /v1/staging
