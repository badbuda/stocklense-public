AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: 'Optional AWS SNS alert email, requiring subscription confirmation'
Conditions:
  EmailAlertsConfigured: !Not [!Equals [!Ref AlertEmail, '']]
Description: StockLens shadow-only signal archive; broker trading is always disabled.
Resources:
  PaperAlertTopic:
    Type: AWS::SNS::Topic
    Condition: EmailAlertsConfigured
  PaperAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: EmailAlertsConfigured
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref PaperAlertTopic
  Signals:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      AttributeDefinitions: [{AttributeName: session_date, AttributeType: S}]
      KeySchema: [{AttributeName: session_date, KeyType: HASH}]
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 1, WriteCapacityUnits: 5}
      SSESpecification: {SSEEnabled: true}
  LambdaLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref 'AWS::StackName', '-shadow']]
      RetentionInDays: 30
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: ArchiveSignalOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'dynamodb:PutItem', Resource: !GetAtt Signals.Arn}
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !GetAtt LambdaLogs.Arn
  ShadowLambda:
    Type: AWS::Lambda::Function
    DependsOn: [LambdaLogs]
    Properties:
      FunctionName: !Join ['', [!Ref 'AWS::StackName', '-shadow']]
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 25
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref Signals
      Code:
        ZipFile: |
          import boto3, hashlib, json, math, os, urllib.request
          from botocore.exceptions import ClientError
          from datetime import datetime, timezone, time, timedelta
          from zoneinfo import ZoneInfo
          def validate(obj, now):
              ny = now.astimezone(ZoneInfo("America/New_York"))
              if ny.weekday() not in (1,2,3,4,5) or not 4 <= ny.hour < 18:
                  raise RuntimeError("NOT_COMPLETED_US_MARKET_SESSION")
              if obj.get("mode") != "SHADOW_ONLY_NO_BROKER_ACTIONS":
                  raise ValueError("NOT_PAPER_SHADOW")
              if obj.get("signal_source") != "QQQ_ADJUSTED_DAILY_CLOSE":
                  raise ValueError("WRONG_SIGNAL_SOURCE")
              if obj.get("execution_plan", {}).get("broker_actions_enabled") is not False:
                  raise ValueError("BROKER_MUST_REMAIN_DISABLED")
              d = obj.get("latest", {})
              if d.get("asof_date") != (ny.date()-timedelta(days=1)).isoformat():
                  raise RuntimeError("STALE_COMPLETED_SESSION")
              gen = datetime.fromisoformat(obj["generated_at_utc"].replace("Z","+00:00"))
              if gen.tzinfo is None or gen > now or now-gen > timedelta(hours=18):
                  raise RuntimeError("STALE_SIGNAL_GENERATION")
              level=d.get("level")
              if not str(obj.get("version","")).startswith("8.0") or type(level) is not int or level not in (1,2,3):
                  raise ValueError("FROZEN_MODEL_LEVEL_INVALID")
              defense=d.get("defense_active")
              if type(defense) is not bool:
                  raise ValueError("FROZEN_MODEL_DEFENSE_INVALID")
              leverage=d.get("target_leverage")
              expected=0.0 if defense else {1:1.25,2:2.0,3:3.0}[level]
              if type(leverage) not in (int,float) or not math.isfinite(leverage) or not math.isclose(leverage,expected,abs_tol=1e-9):
                  raise ValueError("FROZEN_MODEL_LEVERAGE_MISMATCH")
              weights = [d.get("qqq_weight"),d.get("tqqq_weight")]
              if any(not isinstance(w,(float,int)) or isinstance(w,bool) or not math.isfinite(w) or w<0 or w>1 for w in weights):
                  raise ValueError("INVALID_WEIGHTS")
              if sum(weights)>1.000001:
                  raise ValueError("OVERINVESTED")
              return d["asof_date"]
          def handler(event, context):
              now = datetime.now(timezone.utc)
              url = "https://raw.githubusercontent.com/badbuda/stocklense-public/main/shadow_history/latest.json"
              req = urllib.request.Request(url,headers={"User-Agent":"StockLens-AWS-Paper/1"})
              with urllib.request.urlopen(req,timeout=15) as response:
                  body=response.read(100001)
              if len(body)>100000: raise ValueError("SIGNAL_TOO_LARGE")
              data=json.loads(body)
              day=validate(data,now)
              item={"session_date":{"S":day},
                    "recorded_at_utc":{"S":now.isoformat()},
                    "signal_sha256":{"S":hashlib.sha256(body).hexdigest()},
                    "signal_json":{"S":body.decode("utf-8")},
                    "broker_orders_authorized":{"BOOL":False}}
              try:
                  boto3.client("dynamodb").put_item(TableName=os.environ["TABLE_NAME"],
                                                    Item=item,
                                                    ConditionExpression="attribute_not_exists(session_date)",
                                                    ReturnValuesOnConditionCheckFailure="ALL_OLD")
                  status="ARCHIVED"
              except ClientError as exc:
                  if exc.response.get("Error",{}).get("Code")!="ConditionalCheckFailedException": raise
                  old=exc.response.get("Item") or {}
                  if old.get("signal_sha256",{}).get("S")!=item["signal_sha256"]["S"]:
                      raise RuntimeError("DIVERGENT_SHADOW_DUPLICATE") from exc
                  status="MATCHED_DUPLICATE"
              print(json.dumps({"status":status,"session":day,"broker_actions":False}))
              return {"status":status,"session":day}
  PaperEvidenceLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref 'AWS::StackName', '-paper-evidence']]
      RetentionInDays: 30
  PaperEvidenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: AppendOnlyPaperEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'dynamodb:PutItem', Resource: !GetAtt Signals.Arn}
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !GetAtt PaperEvidenceLogs.Arn
  PaperEvidenceLambda:
    Type: AWS::Lambda::Function
    DependsOn: [PaperEvidenceLogs]
    Properties:
      FunctionName: !Join ['', [!Ref 'AWS::StackName', '-paper-evidence']]
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PaperEvidenceRole.Arn
      MemorySize: 128
      Timeout: 80
      Environment:
        Variables:
          TABLE_NAME: !Ref Signals
      Code:
        ZipFile: |
          import boto3,hashlib,json,os,urllib.request
          from botocore.exceptions import ClientError
          from datetime import datetime,time,timezone
          from zoneinfo import ZoneInfo
          ROOT="https://raw.githubusercontent.com/badbuda/stocklense-public/main/"
          def read(path):
              req=urllib.request.Request(ROOT+path,headers={"User-Agent":"StockLens/1"})
              with urllib.request.urlopen(req,timeout=12) as r: b=r.read(200001)
              if len(b)>200000: raise ValueError("TOO_LARGE")
              return b
          def evidence(now,rep,snap,prior,cur):
              ny=now.astimezone(ZoneInfo("America/New_York"))
              day=ny.date().isoformat()
              if ny.weekday()>4 or ny.time()<time(18,0): raise RuntimeError("NOT_CLOSED")
              if rep.get("status")!="PASS_MODELLED_PAPER_ACCOUNTING_NOT_BROKER_FILLS" or rep.get("latest_session")!=day or rep.get("broker_fills_observed") is not False:
                  raise RuntimeError("AUDIT_NOT_PASS")
              if cur.get("latest",{}).get("asof_date")!=day or cur.get("mode")!="SHADOW_ONLY_NO_BROKER_ACTIONS":
                  raise RuntimeError("NO_LATEST_SIGNAL")
              if snap.get("schema_version")!=1 or snap.get("session_date")!=day or snap.get("broker_fills_observed") is not False:
                  raise RuntimeError("INVALID_SESSION_RECEIPT")
              row=snap.get("row",{})
              mt=snap.get("trades",[])
              if row.get("session_date")!=day or not isinstance(mt,list):
                  raise RuntimeError("BAD_RECEIPT_CONTENT")
              if row.get("execution_source")!="YFINANCE_1M_RAW": raise RuntimeError("SYNTHETIC_SOURCE")
              sig=row.get("signal_date","")
              if not sig or sig>=day or prior.get("latest",{}).get("asof_date")!=sig or prior.get("mode")!="SHADOW_ONLY_NO_BROKER_ACTIONS":
                  raise RuntimeError("BAD_PRIOR_SIGNAL")
              at=datetime.fromisoformat(prior["generated_at_utc"].replace("Z","+00:00"))
              op=datetime.fromisoformat(day+"T09:30:00").replace(tzinfo=ZoneInfo("America/New_York"))
              if at.tzinfo is None or at>=op: raise RuntimeError("LATE_SIGNAL")
              for k in ("qqq_weight","tqqq_weight"):
                  if abs(float(prior["latest"][k])-float(row["target_"+k]))>1e-9:
                      raise RuntimeError("WRONG_TARGET")
              if len(mt)!=int(row["trade_count_session"]): raise RuntimeError("TRADE_COUNT_BAD")
              for t in mt:
                  if t.get("symbol") not in ("QQQ","TQQQ") or t.get("side") not in ("BUY","SELL"):
                      raise RuntimeError("BAD_SYMBOL")
                  if t.get("signal_date")!=sig or t.get("execution_session")!=day or t.get("time_et")!=("09:31" if t["side"]=="SELL" else "09:32"):
                      raise RuntimeError("BAD_TRADE_WINDOW")
              return day,row,mt
          def handler(event,context):
              now=datetime.now(timezone.utc)
              rep=json.loads(read("docs/paper_portfolio_integrity.json"))
              snap=json.loads(read("paper_portfolio/latest_session.json"))
              cur=json.loads(read("shadow_history/latest.json"))
              sig=snap.get("row",{}).get("signal_date","")
              if len(sig)!=10 or not sig.replace("-","").isdigit() or sig.count("-")!=2:
                  raise RuntimeError("BAD_SIGNAL_PATH")
              prior=json.loads(read("shadow_history/"+sig+".json"))
              day,row,mt=evidence(now,rep,snap,prior,cur)
              pay=json.dumps({"row":row,"trs":mt},sort_keys=True,separators=(",",":"))
              item={"session_date":{"S":day+"#PAPER"},"paper_evidence_json":{"S":pay},
                    "paper_sha256":{"S":hashlib.sha256(pay.encode()).hexdigest()},
                    "broker_orders_authorized":{"BOOL":False},"broker_fills_observed":{"BOOL":False}}
              try:
                  boto3.client("dynamodb").put_item(TableName=os.environ["TABLE_NAME"],
                      Item=item,ConditionExpression="attribute_not_exists(session_date)",
                      ReturnValuesOnConditionCheckFailure="ALL_OLD")
                  status="ARCHIVED"
              except ClientError as exc:
                  if exc.response.get("Error",{}).get("Code")!="ConditionalCheckFailedException": raise
                  old=exc.response.get("Item") or {}
                  if old.get("paper_sha256",{}).get("S")!=item["paper_sha256"]["S"]:
                      raise RuntimeError("DIVERGENT_PAPER_DUPLICATE") from exc
                  status="MATCHED_DUPLICATE"
              print(json.dumps({"status":status,"session":day,"actual_broker_fills":False}))
              return {"status":status,"session":day}

  PaperEvidenceSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: '09:20 UTC Tue-Sat: archive previous NY calendar trading session after completed GitHub publication.'
      ScheduleExpression: 'cron(20 9 ? * TUE-SAT *)'
      State: ENABLED
      Targets:
        - {Id: PaperEvidence, Arn: !GetAtt PaperEvidenceLambda.Arn}
  PaperEvidencePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref PaperEvidenceLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PaperEvidenceSchedule.Arn
  PaperEvidenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 'Missing real-ETF paper evidence, provider outage, wrong session or corrupt receipt.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref PaperEvidenceLambda}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [EmailAlertsConfigured, [!Ref PaperAlertTopic], !Ref 'AWS::NoValue']

  NightlyRule:
    Type: AWS::Events::Rule
    Properties:
      Description: At 09:10 UTC Tue-Sat, archive prior NY business-day signal after GitHub publication (fail closed on market holidays).
      ScheduleExpression: 'cron(10 9 ? * TUE-SAT *)'
      State: ENABLED
      Targets:
        - {Id: ShadowArchive, Arn: !GetAtt ShadowLambda.Arn}
  RuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref ShadowLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyRule.Arn
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Fail-closed journal errors require review, including US market holidays.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ShadowLambda}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [EmailAlertsConfigured, [!Ref PaperAlertTopic], !Ref 'AWS::NoValue']
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: 'https://token.actions.githubusercontent.com'
      ClientIdList: ['sts.amazonaws.com']
  GitHubAuditRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOIDC}
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
                'token.actions.githubusercontent.com:sub': 'repo:badbuda@39247450/stocklense-public@1408609116:ref:refs/heads/main'
      Policies:
        - PolicyName: ReadOneShadowTableOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['dynamodb:GetItem','dynamodb:DescribeTable'], Resource: !GetAtt Signals.Arn}
Outputs:
  TableName: {Value: !Ref Signals}
  LambdaName: {Value: !Ref ShadowLambda}
  GitHubAuditRoleArn: {Value: !GetAtt GitHubAuditRole.Arn}
