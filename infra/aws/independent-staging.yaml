AWSTemplateFormatVersion: '2010-09-09'
Description: 'StockLens 8.0 AWS-only candidate; isolated, manual-invoke, shadow-only; never replaces stocklens-paper'
Parameters:
  ArtifactBucket:
    Type: String
    Description: 'Private S3 bucket holding a pinned Python ZIP artifact; build time only'
  ArtifactKey:
    Type: String
    Description: 'Immutable artifact ZIP key; do not use latest'
Resources:
  CandidateData:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  CandidateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-candidate'
      RetentionInDays: 14
  CandidateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CandidateS3AndLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub '${CandidateData.Arn}/market/qqq/*'
                  - !Sub '${CandidateData.Arn}/manifests/qqq/*'
                  - !Sub '${CandidateData.Arn}/signals/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CandidateLogs.Arn
  CandidateLambda:
    Type: AWS::Lambda::Function
    DependsOn: CandidateLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-candidate'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: infra.aws.independent_pipeline.handler
      Role: !GetAtt CandidateRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          STOCKLENS_DATA_BUCKET: !Ref CandidateData
  CandidatePaperLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-paper-candidate'
      RetentionInDays: 14
  CandidatePaperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CandidatePaperS3Scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub '${CandidateData.Arn}/signals/*'
                  - !Sub '${CandidateData.Arn}/paper/sessions/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub '${CandidateData.Arn}/market/paper/*'
                  - !Sub '${CandidateData.Arn}/paper/sessions/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CandidatePaperLogs.Arn
  CandidatePaperLambda:
    Type: AWS::Lambda::Function
    DependsOn: CandidatePaperLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-paper-candidate'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: infra.aws.independent_paper.handler
      Role: !GetAtt CandidatePaperRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Timeout: 240
      MemorySize: 1536
      Environment:
        Variables:
          STOCKLENS_DATA_BUCKET: !Ref CandidateData

  CandidateOrchestratorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-orchestrator-candidate'
      RetentionInDays: 14
  CandidateOrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeStagingCandidatesOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt CandidateLambda.Arn
                  - !GetAtt CandidatePaperLambda.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CandidateOrchestratorLogs.Arn
  CandidateOrchestratorLambda:
    Type: AWS::Lambda::Function
    DependsOn: CandidateOrchestratorLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-orchestrator-candidate'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: infra.aws.independent_orchestrator.handler
      Role: !GetAtt CandidateOrchestratorRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Timeout: 480
      MemorySize: 256
      Environment:
        Variables:
          SIGNAL_FUNCTION: !Ref CandidateLambda
          PAPER_FUNCTION: !Ref CandidatePaperLambda
  CandidateOrchestratorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: 'STAGING ONLY. Tue-Sat 00:10 UTC after prior NY close; DISABLED pending manual bootstrap, parity, and AWS owner approval.'
      ScheduleExpression: 'cron(10 0 ? * TUE-SAT *)'
      State: DISABLED
      Targets:
        - Id: StagingOrchestratorOnly
          Arn: !GetAtt CandidateOrchestratorLambda.Arn
          Input: '{"mode":"STAGING_ORCHESTRATOR_ONLY"}'
  CandidateOrchestratorSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CandidateOrchestratorLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CandidateOrchestratorSchedule.Arn

Outputs:
  CandidateFunctionName:
    Value: !Ref CandidateLambda
  CandidateDataBucket:
    Value: !Ref CandidateData
  CandidateLogGroup:
    Value: !Ref CandidateLogs
  CandidatePaperFunctionName:
    Value: !Ref CandidatePaperLambda
  CandidatePaperLogGroup:
    Value: !Ref CandidatePaperLogs
  CandidateOrchestratorFunctionName:
    Value: !Ref CandidateOrchestratorLambda
  CandidateOrchestratorRuleName:
    Value: !Ref CandidateOrchestratorSchedule
