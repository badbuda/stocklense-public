name: StockLens Transition Timing (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/stocklens_transition_timing_20261110.mjs
      - .github/workflows/stocklens-transition-timing.yml
jobs:
  research-transitions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen-8 transition timing factorial
        run: |
          node research/stocklens_transition_timing_20261110.mjs > transition-timing-results.json
          python3 - <<'PY'
          import json, math
          r=json.load(open('transition-timing-results.json'))
          assert r['frozen8_parity'] is True and r['window']['sessions']==3991
          assert len(r['combinations'])==8
          assert r['broker_orders'] is False and r['production_changed'] is False
          assert r['real_breadth_tested'] is False and r['israeli_tax_modeled'] is False
          assert {k:sum(x['component_count']==k for x in r['combinations']) for k in range(4)}=={0:1,1:3,2:3,3:1}
          print('TRANSITION_FACTORIAL_PASS')
          for v in r['combinations']:
              assert math.isfinite(v['cagr']) and math.isfinite(v['maxdd'])
              assert len(v['stress'])==4
              print(v['name'], 'CAGR',round(v['cagr']*100,2),'MaxDD',round(v['maxdd']*100,2),
                    'deltaCAGR_pp',round(v['cagr_delta_pp'],2),'deltaMaxDD_pp',round(v['maxdd_gain_pp'],2),
                    'trades',v['trades'],'changed',v['changed_sessions'])
          PY
      - name: Save reproducible stress and era outcomes
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-transition-timing-factorial-20261110
          path: transition-timing-results.json
          retention-days: 30
