name: SL-64 prospective ST Paper startup and receipt verification
on:
  pull_request:
    paths:
      - 'infra/aws/sl64_epoch5_*'
      - 'tests/test_sl64_epoch5_*'
      - '.github/workflows/sl64-epoch5-auto-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-epoch-no-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements.txt pytest boto3
      - run: python -m pytest -q tests/test_sl64_epoch5_preopen.py tests/test_sl64_epoch5_guarded_release.py
      - name: Validate both generated CloudFormation templates in the ST region
        run: |
          python -m pip install --quiet cfn-lint==1.61.0
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from infra.aws.sl64_epoch5_automated_release import _new_template
          for armed in (False, True):
              template = _new_template("deployment/test.zip", {"Runtime": "python3.13"},
                                       "arn:aws:sns:eu-central-1:634740393398:st-alarms",
                                       armed=armed, approval_sha="a"*64)
              (Path(os.environ["RUNNER_TEMP"]) / f"epoch5-{armed}.json").write_text(json.dumps(template))
          PY
          cfn-lint --regions eu-central-1 --ignore-checks W3005 --template "$RUNNER_TEMP"/epoch5-*.json
