name: SL-63 guarded auto ST Epoch4 release change-sets and alarms (offline)
on:
  pull_request:
    paths:
      - 'infra/aws/sl63_epoch4_automated_release.py'
      - 'tests/test_sl63_epoch4_automated_release.py'
      - '.github/workflows/sl63-epoch4-automated-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-cloudformation-before-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements.txt pytest
      - name: Dark then armed ST change-set, source gate, watchdog IAM, SNS, backfill
        run: |
          python -m pytest -q tests/test_sl63_epoch4_automated_release.py tests/test_sl63_epoch4_lambda.py tests/test_sl63_epoch4_prospective_runtime.py tests/test_sl63_epoch4_watchdog.py
