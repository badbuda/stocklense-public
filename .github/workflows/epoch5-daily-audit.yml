name: StockLens active ST Paper ledger audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'infra/aws/epoch5_daily_audit.py'
      - '.github/workflows/epoch5-daily-audit.yml'
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.AWS_STOCKLENS_ST_AUDIT_ROLE_ARN || 'arn:aws:iam::634740393398:role/stocklens-st-paper-audit--GitHubSTPaperAcceptanceRo-CbZTBKwqwUJg' }}
          role-session-name: stocklens-epoch5-ledger-readonly
      - run: python -m pip install --quiet boto3 exchange-calendars==4.13.2
      - run: python -m infra.aws.epoch5_daily_audit
