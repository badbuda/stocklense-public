name: StockLens Fast Guard
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  actions: read

concurrency:
  group: stocklens-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify complete source handoff before downstream CI
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python ci_transfer_guard.py
      - name: Compile and smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q .
          python -c "from source_hygiene import syntax_errors; e=syntax_errors(); print(e); assert not e"
          python dashboard_workbench.py
          python simulator_smoke.py
          node --check docs/portal.js
          node --check docs/portal-insights.js
          node --check docs/portal-cloud.js
          node --check tests/portal_insights_unit.cjs
          node tests/portal_insights_unit.cjs
          node --check tests/portal_browser_smoke.cjs
      - name: Unit and regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Compute frozen-vs-risk-matched and volatility-drag falsification in one batch
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_etf_two_question_audit.py
          test -s research/results/two_questions_risk_matched.json
          test -s research/reports/two_questions_risk_matched.md
      - name: Preserve two-question research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-two-question-audit
          path: |
            research/results/two_questions_risk_matched.json
            research/reports/two_questions_risk_matched.md
          if-no-files-found: warn
          retention-days: 30
      - name: Vol60 continuous-risk and ramped re-entry batch on observed ETF next-opens
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_etf_vol60_reentry_audit.py
          test -s research/results/vol60_ramped_reentry_observed_open.json
          test -s research/reports/vol60_ramped_reentry_observed_open.md
      - name: Preserve Vol60 ramped re-entry research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-vol60-ramped-reentry
          path: |
            research/results/vol60_ramped_reentry_observed_open.json
            research/reports/vol60_ramped_reentry_observed_open.md
          if-no-files-found: warn
          retention-days: 30
      - name: Complete offline crisis, overnight and modeled gap-cost research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_etf_execution_forensics.py
          test -s research/results/observed_execution_crisis_forensics.json
          test -s research/reports/observed_execution_crisis_forensics.md
      - name: Preserve one-batch crisis execution forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-crisis-execution-forensics
          path: |
            research/results/observed_execution_crisis_forensics.json
            research/reports/observed_execution_crisis_forensics.md
          if-no-files-found: warn
          retention-days: 30
      - name: Causal ML meta leverage monthly walk-forward validation on observed ETFs
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python observed_etf_causal_ml_meta_leverage.py
          test -s research/results/ml_meta_leverage_walkforward.json
          test -s research/reports/ml_meta_leverage_walkforward.md
      - name: Archive isolated ML research without automatic production promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-ml-meta-leverage-observed-walkforward
          path: |
            research/results/ml_meta_leverage_walkforward.json
            research/reports/ml_meta_leverage_walkforward.md
          if-no-files-found: warn
          retention-days: 30
      - name: Strict point-in-time news provenance and event study readiness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python news_event_study.py
          test -s research/results/news_pit_event_study.json
          test -s research/reports/news_pit_event_study.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/results/news_pit_event_study.json').read_text())
          assert r['capital_deployment_authorized'] is False
          assert r['automatic_model_promotion'] is False
          assert r['original_8_0_changed'] is False
          if not r['user_archival_journal_present']:
              assert r['status']=='BLOCKED_NO_GENUINE_TIMESTAMPED_HISTORICAL_EVENT_COHORT'
              assert r['actually_joined_eligible_market_events']==0
          PY
      - name: Preserve news provenance diagnostic, never fake historical alpha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-news-point-in-time-readiness
          path: |
            research/results/news_pit_event_study.json
            research/reports/news_pit_event_study.md
          if-no-files-found: warn
          retention-days: 30
      - name: One registered batch — five observed ETF risk challengers and cash sensitivity
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_etf_four_challengers_batch.py
          test -s research/results/four_challengers_cash_and_event_samples.json
          test -s research/reports/four_challengers_cash_and_event_samples.md
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('research/results/four_challengers_cash_and_event_samples.json').read_text())
          assert o['frozen_daily_ledger_parity'] is True
          assert o['predeclared_multiplicity'] == 5
          assert o['capital_deployment_authorized'] is False
          assert o['frozen_stocklens8_changed'] is False
          assert o['synthetic_TQQQ_returns_used'] is False
          assert o['automatic_promotion'] is False
          s=json.loads(Path('research/samples/official_release_2022_not_pit.json').read_text())
          assert s['eligible_historical_events'] == 0
          assert all(e['first_seen_proven'] is False for e in s['samples'])
          PY
      - name: Preserve multi-challenger batch research without promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-fixed-challengers-and-cash
          path: |
            research/results/four_challengers_cash_and_event_samples.json
            research/reports/four_challengers_cash_and_event_samples.md
          if-no-files-found: warn
          retention-days: 30
      - name: Static dashboard document integrity
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python dashboard_bundle_validate.py
          python - <<'PY'
          from pathlib import Path
          s=Path("docs/index.html").read_text()
          assert s.count("</script>")==2
          assert s.count("</html>")==1
          assert s.rstrip().endswith("</html>")
          PY

      - name: Two new distinct economic input gates — historical cash as-of and non-Nasdaq price readiness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python research_cash_rate_broker_proxy.py
          python research_diversified_sleeve_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/results/cash_rate_asof_readiness.json').read_text())
          b=json.loads(Path('research/results/non_nasdaq_sleeve_readiness.json').read_text())
          assert a['status']=='BLOCKED_NO_HISTORICAL_ASOF_RATE_INPUT'
          assert b['status']=='BLOCKED_NO_OBSERVED_GLD_TLT_SOURCE'
          assert a['cash_alpha_proven'] is False and not a['capital_deployment_authorized']
          assert b['historical_diversification_alpha_proven'] is False
          assert not b['capital_deployment_authorized']
          PY
      - name: Archive independent economic data gates (blocked is an honest result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-cash-rate-and-nonnasdaq-readiness
          path: |
            research/results/cash_rate_asof_readiness.json
            research/reports/cash_rate_asof_readiness.md
            research/results/non_nasdaq_sleeve_readiness.json
            research/reports/non_nasdaq_sleeve_readiness.md
          if-no-files-found: warn
          retention-days: 30

      - name: Bounded observed GLD/TLT and official EFFR acquisition — optional and never trading evidence
        if: ${{ github.head_ref == 'research/sl9-012-observed-source-acquisition-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_source_acquisition.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("research/results/observed_external_data_intake.json").read_text())
          assert s["capital_deployment_authorized"] is False
          assert s["strategy_returns_computed"] is False
          assert s["synthetic_etf_prices_used"] is False
          assert not s["historical_provider_first_seen_proven"]
          PY
      - name: Archive observed external prices and rate effective-dates with audit warnings
        if: ${{ always() && github.head_ref == 'research/sl9-012-observed-source-acquisition-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-observed-external-source-intake
          path: |
            research/results/observed_external_data_intake.json
            research/private/non_nasdaq_observed_etfs.json
            research/private/effr_effective_dates_without_publication_clock.json
          if-no-files-found: warn
          retention-days: 30

      - name: Restore locked actual observed GLD/TLT from previous verified CI
        if: ${{ github.head_ref == 'research/sl9-013-fixed-observed-nonnasdaq-sleeves-20261011' }}
        uses: actions/download-artifact@v4
        with:
          name: stocklens-observed-external-source-intake
          run-id: 38108795287
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research
      - name: Run SL9-013 real ETF sleeves using locked original market data
        if: ${{ github.head_ref == 'research/sl9-013-fixed-observed-nonnasdaq-sleeves-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -s research/private/non_nasdaq_observed_etfs.json
          python observed_nonnasdaq_sleeve_study.py
          test -s research/results/observed_nonnasdaq_fixed_sleeves.json
          test -s research/reports/observed_nonnasdaq_fixed_sleeves.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/results/observed_nonnasdaq_fixed_sleeves.json').read_text())
          assert r['baseline_day_by_day_parity'] is True
          assert r['source_data_sha256']=='2f680455c1ba81eb2e859eb9520efb2c1139d2e2861ba715c697712004ee2210'
          assert r['capital_deployment_authorized'] is False
          assert r['automatic_promotion'] is False
          assert r['no_synthetic_etf_returns'] is True
          PY
      - name: Archive fixed REAL observed non-Nasdaq sleeve outcomes (research only)
        if: ${{ always() && github.head_ref == 'research/sl9-013-fixed-observed-nonnasdaq-sleeves-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-fixed-observed-nonnasdaq-sleeves
          path: |
            research/results/observed_nonnasdaq_fixed_sleeves.json
            research/reports/observed_nonnasdaq_fixed_sleeves.md
          if-no-files-found: warn
          retention-days: 30

      - name: Restore previously verified observed GLD TLT and NY Fed EFFR effective dates for SL9-014
        if: ${{ github.head_ref == 'research/sl9-014-economic-input-audit-and-crisis-attribution-20261011' }}
        uses: actions/download-artifact@v4
        with:
          name: stocklens-observed-external-source-intake
          run-id: 38108795287
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research
      - name: One deterministic EFFR cash accounting and downside attribution diagnostic batch
        if: ${{ github.head_ref == 'research/sl9-014-economic-input-audit-and-crisis-attribution-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -s research/private/non_nasdaq_observed_etfs.json
          test -s research/private/effr_effective_dates_without_publication_clock.json
          python research_actual_effr_cash_sensitivity.py
          python observed_sleeve_crisis_diagnostics.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/results/effr_effective_date_cash_sensitivity.json').read_text())
          v=json.loads(Path('research/results/fixed_sleeve_crisis_diagnostics.json').read_text())
          assert r['frozen_daily_nav_parity'] is True
          assert r['independently_verified_historical_publication_times'] is False
          assert r['interest_paid_by_real_broker_proven'] is False
          assert r['automatic_promotion'] is False
          assert r['synthetic_tqqq_used'] is False
          assert v['no_new_hypothesis_tuning'] is True
          assert v['capital_deployment_authorized'] is False
          assert v['real_prices_no_synthetic_etf'] is True
          PY
      - name: Archive conditioned cash and frozen nonNasdaq drawdown diagnostics
        if: ${{ always() && github.head_ref == 'research/sl9-014-economic-input-audit-and-crisis-attribution-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-effr-cash-and-fixed-sleeve-crisis-audit
          path: |
            research/results/effr_effective_date_cash_sensitivity.json
            research/reports/effr_effective_date_cash_sensitivity.md
            research/results/fixed_sleeve_crisis_diagnostics.json
            research/reports/fixed_sleeve_crisis_diagnostics.md
          if-no-files-found: warn
          retention-days: 30

      - name: Preregistered observed QLD substitution vs immutable frozen 8.0
        if: ${{ github.head_ref == 'research/sl9-015-qld-real-etf-instrument-substitution-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_qld_instrument_substitution.py
          test -s research/results/qld_instrument_substitution.json
          test -s research/reports/qld_instrument_substitution.md
          test -s research/private/observed_qld_2010_2026.json
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('research/results/qld_instrument_substitution.json').read_text())
          assert x['parity_all_four_fee_lag_cases'] is True
          assert x['actual_observed_qld_sessions']==4191
          assert x['observed_real_qqq_qld_tqqq'] is True
          assert x['synthetic_tqqq_returns_used'] is False
          assert x['frozen_8_0_changed'] is False
          assert x['automatic_promotion'] is False and x['capital_deployment_authorized'] is False
          PY
      - name: Archive original observed QLD snapshot and fixed test reports (30 days)
        if: ${{ always() && github.head_ref == 'research/sl9-015-qld-real-etf-instrument-substitution-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-real-qld-physical-instrument-test
          path: |
            research/private/observed_qld_2010_2026.json
            research/results/qld_instrument_substitution.json
            research/reports/qld_instrument_substitution.md
          if-no-files-found: warn
          retention-days: 30

      - name: Fixed official Cboe VIX prior-close risk batch (no model promotion)
        if: ${{ github.head_ref == 'research/sl9-016-actual-vix-prior-session-fixed-risk-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_vix_prior_session_study.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/results/observed_vix_fixed_guard_results.json').read_text())
          assert p['frozen_baseline_nav_parity'] is True
          assert p['source_provider_first_seen_verified'] is False
          assert p['vix_daily_close_prior_session_only'] is True
          assert p['matched_prior_vix_sessions'] == 4190
          assert p['real_qqq_tqqq_no_synthetic'] is True
          assert p['automatic_promotion'] is False
          assert p['capital_deployment_authorized'] is False
          PY
      - name: Archive real Cboe VIX source and fixed historical falsification
        if: ${{ always() && github.head_ref == 'research/sl9-016-actual-vix-prior-session-fixed-risk-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-cboe-vix-fixed-risk-study
          path: |
            research/private/vix_official_history_as_observed_20261011.json
            research/results/observed_vix_fixed_guard_results.json
            research/reports/observed_vix_fixed_guard_results.md
          if-no-files-found: warn
          retention-days: 30

      - name: SL9-019 two fixed inverse-variance and downside-semivariance real ETF tests
        if: ${{ github.head_ref == 'research/sl9-019-inverse-variance-and-downside-drag-20261011' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python observed_etf_inverse_variance_drag_study.py
          test -s research/results/inverse_variance_downside_drag_observed_etfs.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/results/inverse_variance_downside_drag_observed_etfs.json').read_text())
          assert x['frozen_day_by_day_parity'] is True
          assert x['sessions']==4191
          assert x['no_synthetic_TQQQ_returns'] is True
          assert x['capital_deployment_authorized'] is False if 'capital_deployment_authorized' in x else not x['live_broker_orders_authorized']
          assert x['automatic_promotion'] is False
          PY
      - name: Archive preregistered inverse variance and downside real ETF outcomes
        if: ${{ always() && github.head_ref == 'research/sl9-019-inverse-variance-and-downside-drag-20261011' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-inverse-variance-downside-real-etf-falsification
          path: |
            research/results/inverse_variance_downside_drag_observed_etfs.json
            research/reports/inverse_variance_downside_drag_observed_etfs.md
          if-no-files-found: warn
          retention-days: 30
