name: StockLens ST Paper Daily Read-Only Acceptance

# Runs AFTER the independent ST pre-open Signal retries (through 12:30 UTC)
# and ST Paper at 13:00 UTC. The old Shadow-triggered 03:00 UTC job was
# necessarily premature. This workflow never backfills/activates trading.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/st-paper-daily-readonly.yml'
      - 'infra/aws/st_paper_closeout_readonly.py'
      - 'infra/aws/st_paper_operational_blockers_readonly.py'
      - 'infra/aws/st-github-paper-audit-role.yaml'
  # 14:15 UTC Tuesday-Saturday, one hour+ after scheduled ST Paper.
  # Includes overnight Monday session via Tuesday and Friday via Saturday.
  schedule:
    - cron: '15 14 * * 2-6'

permissions:
  contents: read
  id-token: write

concurrency:
  group: stocklens-st-paper-daily-readonly
  cancel-in-progress: true

jobs:
  st-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The dedicated role was provisioned by the operator. Its ARN is public
      # infrastructure metadata, NOT an AWS credential. Prefer repository
      # variable when defined; the pinned fallback permits the already-created
      # role to be audited without requiring gh CLI authentication in CloudShell.
      - name: Verify configured AWS read-only identity
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_STOCKLENS_ST_AUDIT_ROLE_ARN || 'arn:aws:iam::634740393398:role/stocklens-st-paper-audit--GitHubSTPaperAcceptanceRo-CbZTBKwqwUJg' }}
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" || {
            echo "::error::Dedicated ST acceptance AWS role not configured; ST NOT VERIFIED. Do not use the legacy DynamoDB-only audit role."
            exit 1
          }
      - name: Assume existing read-only AWS audit role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.AWS_STOCKLENS_ST_AUDIT_ROLE_ARN || 'arn:aws:iam::634740393398:role/stocklens-st-paper-audit--GitHubSTPaperAcceptanceRo-CbZTBKwqwUJg' }}
          role-session-name: stocklens-st-daily-readonly
      - name: Select the completed exchange session due for ST Paper
        run: |
          python -m pip install --disable-pip-version-check --quiet boto3 -r requirements.txt
          python -c "from market_calendar import latest_st_paper_due_session; print('ST_SESSION=' + latest_st_paper_due_session())" >> "$GITHUB_ENV"
      - name: Snapshot all Paper scheduler, alarm and S3 blockers (read only)
        shell: bash
        run: |
          set -euo pipefail
          python infra/aws/st_paper_operational_blockers_readonly.py --session "$ST_SESSION" > "$RUNNER_TEMP/st-blockers.json"
          python - "$RUNNER_TEMP/st-blockers.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          with Path(sys.argv[2]).open('a') as out:
              out.write("### Independent Paper operational blockers (not acceptance)\n\n")
              out.write("Session: "+str(d.get("session"))+"\n\n")
              for key,entry in d.get("schedules",{}).items():
                  out.write("- "+key+": "+str(entry["state"])+" (cron match: "+
                            str(entry["cron_match"])+")\n")
              out.write("\nNon-OK ST alarms: "+
                        ", ".join(a["name"]+"="+str(a["state"])
                                  for a in d.get("alarms_non_ok",[]))+"\n\n")
              for key,entry in d.get("s3_objects",{}).items():
                  out.write("- S3 "+key+": "+entry["status"]+"\n")
              out.write("\n**Not proof of Paper readiness.** "+
                        ", ".join(d.get("blockers",[]))+"\n\n")
          print("ST_OPERATIONAL_BLOCKERS",d["status"],d.get("blockers"))
          PY
      - name: Check next prospective ST opening source without writing an approval
        run: |
          python - <<'PYTHON'
          from datetime import datetime, timezone
          import os
          import boto3
          from botocore.exceptions import ClientError
          from infra.aws.sl64_epoch5_start import next_open_session

          now = datetime.now(timezone.utc)
          first = next_open_session(now)
          os.environ["STOCKLENS_ST_FIRST_SESSION"] = first
          from infra.aws import sl64_epoch5_preopen as approval
          aws = boto3.Session(region_name=approval.REGION)
          try:
              check = approval.preflight(aws.client("sts"), aws.client("s3"), now=now)
              status = "VERIFIED_PREOPEN_SOURCE" if check["preopen_approval_new_write_eligible"] else "OUTSIDE_PREOPEN_WINDOW"
          except ClientError as exc:
              status = "SOURCE_UNVERIFIED_" + exc.response["Error"]["Code"]
          except (RuntimeError, ValueError) as exc:
              status = "SOURCE_NOT_QUALIFIED_" + type(exc).__name__
          print("NEXT_ST_START", first, approval.SOURCE, status)
          PYTHON
      - name: Inspect separate Epoch5 rules and version inventory
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import boto3
          from botocore.exceptions import ClientError
          from infra.aws.st_paper_operational_blockers_readonly import paper_object_inventory

          session = os.environ["ST_SESSION"]
          aws = boto3.Session(region_name="eu-central-1")
          events, s3 = aws.client("events"), aws.client("s3")
          rows = [f"### Epoch5 inventory for {session} (metadata only)"]
          for rule in ("stocklens-st-epoch5-paper-eod", "stocklens-st-epoch5-watchdog-eod"):
              try:
                  actual = events.describe_rule(Name=rule)
                  state = actual["State"]
                  if rule == "stocklens-st-epoch5-paper-eod":
                      description = actual.get("Description", "")
                      if description.startswith("After-close modeled Paper; first_session="):
                          os.environ["STOCKLENS_ST_FIRST_SESSION"] = description.rsplit("=", 1)[1]
              except ClientError as exc:
                  state = exc.response["Error"]["Code"]
              rows.append(f"- {rule}: {state}")
          from infra.aws.sl64_epoch5_immutable_store import FIRST, PREFIX, key_for
          rows.append(f"- book inception: {FIRST}")
          keys = {"preopen approval": PREFIX + "preopen-inception-approval.json", "genesis": key_for("genesis")}
          for kind in ("sessions", "continuity"):
              if session >= FIRST:
                  keys[kind] = key_for(kind, session)
          for label, key in keys.items():
              try:
                  state = paper_object_inventory(s3, key)["status"]
              except ClientError as exc:
                  state = exc.response["Error"]["Code"]
              rows.append(f"- {label}: {state}")
          report = "\n".join(rows) + "\n"
          print(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(report)
          PYTHON
      - name: Check live ST Paper for the due exchange session
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python infra/aws/st_paper_closeout_readonly.py --session "$ST_SESSION" > "$RUNNER_TEMP/st-readonly.json"
          result="$?"
          set -e
          python - "$RUNNER_TEMP/st-readonly.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          o=json.loads(Path(sys.argv[1]).read_text())
          status=o.get('status','BLOCKED')
          reason=o.get('reason','')
          print(status,reason)
          with Path(sys.argv[2]).open('a') as out:
              out.write('### StockLens ST — authenticated daily readback\n')
              out.write('Session: '+str(o.get('session'))+'\n\n')
              out.write('**'+status+'** (modeled Paper only; never broker fills)\n\n')
              if reason: out.write('Blocker: '+reason+'\n')
              out.write('PROD is never mutated. Missing Paper is not backfilled.\n')
          PY
          exit "$result"
