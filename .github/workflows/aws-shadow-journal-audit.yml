name: StockLens AWS Shadow Journal Read Audit

on:
  workflow_dispatch:
    inputs:
      verify_session:
        description: Verify previous NY session archive (off = credentials preflight only)
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-shadow-journal-audit.yml'
      - 'aws_shadow_journal_verify.py'
  schedule:
    - cron: '40 9 * * 2-6'

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROLE_ARN: ${{ vars.AWS_STOCKLENS_AUDIT_ROLE_ARN }}
      TABLE: ${{ vars.AWS_STOCKLENS_JOURNAL_TABLE }}
    steps:
      - name: Require complete nonsecret AWS repository variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" || { echo "::error::Missing AWS_STOCKLENS_AUDIT_ROLE_ARN"; exit 1; }
          test -n "$TABLE" || { echo "::error::Missing AWS_STOCKLENS_JOURNAL_TABLE"; exit 1; }
          echo "AWS_STOCKLENS_CONFIG=SET"
      - name: Checkout XNYS archive-calendar guard
        uses: actions/checkout@v4
      - name: Classify previous NY local day using exchange session calendar
        id: market_calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet exchange-calendars==4.13.2
          python aws_journal_session_guard.py --github-output "$GITHUB_OUTPUT"
      - name: Assume temporary read-only AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.AWS_STOCKLENS_AUDIT_ROLE_ARN }}
          role-session-name: stocklens-paper-audit
      - name: Prove AWS identity and table access
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query 'Arn' --output text
          status="$(aws dynamodb describe-table --table-name "$TABLE" --query 'Table.TableStatus' --output text)"
          test "$status" = "ACTIVE" || { echo "::error::DynamoDB table not ACTIVE: $status"; exit 1; }
          echo "AWS_STOCKLENS_OIDC_PREFLIGHT=PASS_READ_ONLY_TABLE_ACTIVE"
          echo "AWS_STOCKLENS_LIVE_TRADING_AUTHORIZED=false"
      - name: Verify the scheduled completed-session signal, never broker fills
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_session)) && steps.market_calendar.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          session="$(TZ=America/New_York date -d yesterday +%F)"
          aws dynamodb get-item \
            --table-name "$TABLE" \
            --key "{\"session_date\":{\"S\":\"$session\"}}" \
            --consistent-read \
            --output json > /tmp/aws-journal.json
          python3 aws_shadow_journal_verify.py /tmp/aws-journal.json "$session"

      - name: Validate separate modeled paper record in AWS; never broker fills
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_session)) && steps.market_calendar.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          session="$(TZ=America/New_York date -d yesterday +%F)"
          key="$session#PAPER"
          aws dynamodb get-item --table-name "$TABLE" --key "{\"session_date\":{\"S\":\"$key\"}}" --consistent-read --output json > /tmp/paper.json
          SESSION="$session" python3 - <<'PY'
          import json,os
          from aws_journal_export import decode_paper
          session=os.environ["SESSION"]
          item=json.load(open("/tmp/paper.json")).get("Item")
          if not item: raise SystemExit("AWS_PAPER_MISSING_CURRENT_SESSION")
          # This is the same fail-closed parser used for exported archive receipts;
          # matching only a self-supplied hash is insufficient.
          try:
              verified=decode_paper(item,session)
          except (ValueError,KeyError,TypeError) as exc:
              raise SystemExit("AWS_PAPER_INVALID_ARCHIVE: "+str(exc)) from exc
          print("AWS_PROSPECTIVE_PAPER=PASS_MODELED_ONLY;session="+session+
                ";trade_count="+str(len(verified["value"]["trs"])))
          PY
      - name: Cross-check previous archived shadow with next-session modeled paper
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_session)) && steps.market_calendar.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          session="${{ steps.market_calendar.outputs.session }}"
          prior="$(SESSION="$session" python3 - <<'PY'
          import os
          from aws_paper_pairing import previous_session
          print(previous_session(os.environ["SESSION"]))
          PY
          )"
          aws dynamodb get-item --table-name "$TABLE" \
            --key "{\"session_date\":{\"S\":\"$prior\"}}" \
            --consistent-read --output json > /tmp/prior-signal.json
          python3 aws_paper_pairing.py --session "$session" \
            --prior-signal /tmp/prior-signal.json --paper /tmp/paper.json
          echo "AWS_SIGNAL_PAPER_PAIRING=PASS_MODELED_ONLY_NOT_BROKER_FILLS"

      - name: Record daily AWS journal audit outcome on project issue
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_session)) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_STATUS: ${{ job.status }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          MARKET_SESSION_REQUIRED: ${{ steps.market_calendar.outputs.required }}
          MARKET_CALENDAR_OUTCOME: ${{ steps.market_calendar.outcome }}
        run: |
          set -euo pipefail
          session="$(TZ=America/New_York date -d yesterday +%F)"
          verdict="${AUDIT_STATUS}"
          if [[ "${MARKET_CALENDAR_OUTCOME}" == "success" && "${MARKET_SESSION_REQUIRED}" == "false" ]]; then
            verdict="NO_XNYS_SESSION_EXPECTED;IDENTITY_AND_TABLE_PREFLIGHT=${AUDIT_STATUS}"
          fi
          gh issue comment 10 -R badbuda/stocklense-public --body "AWS_SIGNAL_AND_PAPER_AUDIT ${session}: **${verdict}**. XNYS-calendar-aware read-only AWS audit; broker orders and fills remain disabled. [GitHub run](https://github.com/badbuda/stocklense-public/actions/runs/${AUDIT_RUN_ID}). If failure, inspect step logs before claiming records were archived."
