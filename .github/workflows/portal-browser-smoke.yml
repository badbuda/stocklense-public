name: StockLens Portal Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-browser-smoke.yml'
      - 'docs/portal.js'
      - 'docs/portal-cloud.js'
      - 'docs/portal-insights.js'
      - 'docs/portal.html'
      - 'docs/portal.css'
      - 'tests/portal_browser_smoke.cjs'

permissions:
  contents: read

concurrency:
  group: stocklens-portal-browser
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve real production docs (with full Yahoo ETF data)
        run: |
          test -s docs/portal-history.json
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs >/tmp/stocklens-http.log 2>&1 &
          sleep 2
      - name: Check E2E test syntax before launching browser
        run: node --check tests/portal_browser_smoke.cjs
      - name: Verify local build in desktop and mobile Chromium
        env:
          PORTAL_SCREENSHOT_SUFFIX: local
        run: node tests/portal_browser_smoke.cjs
      - name: Verify actual AWS Amplify deployed website, not only local source
        env:
          PORTAL_BASE_URL: https://main.d20nvlvzjafg5m.amplifyapp.com
          PORTAL_SCREENSHOT_SUFFIX: aws
        run: |
          # Amplify deploys asynchronously after GitHub main pushes.
          # Never compare a newly merged checkout to stale CDN HTML.
          expected="$(sha256sum docs/portal.html | cut -d' ' -f1)"
          ready=0
          for attempt in $(seq 1 45); do
            curl -fLsS --max-time 15 "$PORTAL_BASE_URL/portal.html?deploy_probe=$attempt" -o /tmp/stocklens-deployed.html || true
            actual="$(sha256sum /tmp/stocklens-deployed.html 2>/dev/null | cut -d' ' -f1 || true)"
            if test "$actual" = "$expected"; then
              echo "AMPLIFY_DEPLOY_SHA_MATCH=PASS;attempt=$attempt;sha=$actual"
              ready=1
              break
            fi
            echo "Amplify is still publishing; remote=$actual source=$expected attempt=$attempt"
            sleep 8
          done
          if test "$ready" != 1; then
            echo "::error::AWS Amplify did not publish the exact expected main HTML artifact"
            exit 1
          fi
          node tests/portal_browser_smoke.cjs
      - name: Upload actual screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-portal-browser-local-and-amplify
          path: |
            /tmp/stocklens-desktop-local.png
            /tmp/stocklens-mobile-local.png
            /tmp/stocklens-desktop-aws.png
            /tmp/stocklens-mobile-aws.png
          if-no-files-found: warn
          retention-days: 14
