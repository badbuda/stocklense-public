name: SL-63 Verify ST deployed economic ZIP parity harness (offline tests)
on:
  pull_request:
    paths:
      - 'infra/aws/sl63_deployed_paper_source_parity.py'
      - 'tests/test_sl63_deployed_paper_source_parity.py'
      - '.github/workflows/sl63-deployed-zip-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zip-fingerprints-and-immutable-test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements.txt pytest
      - name: Hash synthetic ZIP modules, reject drift, traversal and unverified handler
        run: python -m pytest -q tests/test_sl63_deployed_paper_source_parity.py
