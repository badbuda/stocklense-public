name: SL-63 Epoch4 immutable S3 Paper Continuity crash recovery protocol (offline)
on:
  pull_request:
    paths:
      - 'infra/aws/sl63_epoch4_immutable_store.py'
      - 'tests/test_sl63_epoch4_immutable_store.py'
      - '.github/workflows/sl63-epoch4-immutable-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-storage-crash-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - name: S3 immutable 412, missing Continuity retry, version SHA, tamper and no broker
        run: python -m pytest -q tests/test_sl63_epoch4_immutable_store.py
