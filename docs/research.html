<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockLens Research Lab</title><style>
body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}header,main{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#151c32;border:1px solid #28324e;border-radius:14px;padding:14px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:block;font-size:12px;color:#aeb8d4}input,select,button{width:100%;box-sizing:border-box;padding:9px;background:#0f172a;color:#eef2ff;border:1px solid #334155;border-radius:8px}button{cursor:pointer}canvas{width:100%;height:300px;background:#10172a;border-radius:12px}.warn{color:#fbbf24}.big{font-size:28px;font-weight:700}a{color:#93c5fd}</style></head>
<body><header><h1>StockLens Research Lab</h1><p class="warn">Sandbox בלבד — frozen 8.0 is never modified.</p><a href="./index.html">← Operations</a></header><main>
<div class="controls"><div class="card"><label>From</label><input id="from" type="date"></div><div class="card"><label>To</label><input id="to" type="date"></div><div class="card"><label>Preset</label><select id="preset"><option value="all">Full history</option><option value="5">Last 5 years</option><option value="3">Last 3 years</option><option value="1">Last year</option></select></div></div><div class="controls" id="controls"></div><div class="grid"><div class="card"><label>Research transitions</label><div class="big" id="trans">—</div></div><div class="card"><label>Defense sessions</label><div class="big" id="def">—</div></div><div class="card"><label>Changed vs frozen</label><div class="big" id="changed">—</div></div></div>
<div class="card"><h3>Experiment workspace</h3><div class="controls"><div><label>Experiment name</label><input id="expName" placeholder="e.g. VIX 30 defense"></div><div><label>&nbsp;</label><button id="saveExp">Save snapshot</button></div></div><div id="savedExperiments" class="muted">No saved experiments on this device.</div></div><div class="card"><h3>Research leverage vs frozen baseline</h3><canvas id="chart" width="1100" height="300"></canvas></div></main>
<script type="module">import{simulate,sliceRange}from'./research-engine.js';const d=await(await fetch('./research.json',{cache:'no-store'})).json();let p={trendRetention:.99,trendReentry:1.01,l3ToL2:.32,l2ToL3:.28,l2ToL1:.42,l1ToL3:.28,l1ToL2:.38,vixFilter:null};
const defs=[['trendRetention','.95','1.02','.005'],['trendReentry','.98','1.05','.005'],['l3ToL2','.20','.50','.01'],['l2ToL3','.15','.40','.01'],['l2ToL1','.25','.65','.01'],['l1ToL2','.20','.55','.01']];
controls.innerHTML=defs.map(x=>'<div class="card"><label>'+x[0]+' <b id="v-'+x[0]+'">'+p[x[0]]+'</b></label><input id="'+x[0]+'" type="range" min="'+x[1]+'" max="'+x[2]+'" step="'+x[3]+'" value="'+p[x[0]]+'"></div>').join('')+'<div class="card"><label>Experimental VIX defense filter</label><select id="vixFilter"><option value="">Off</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option></select></div>';
let lastSimulation=null;function renderSaved(){const xs=JSON.parse(localStorage.sl_research_experiments||'[]');savedExperiments.innerHTML=xs.length?xs.slice().reverse().map(x=>'<div class="card"><b>'+x.name+'</b> · '+x.from+' → '+x.to+' · CAGR '+pct(x.metrics.cagr)+' · MaxDD '+pct(x.metrics.maxDrawdown)+' · '+new Date(x.savedAt).toLocaleString()+'</div>').join(''):'No saved experiments on this device.'}function pct(x){return x==null?'—':(x*100).toFixed(2)+'%'}function draw(){const rows=sliceRange(d.rows,from.value,to.value);const s=simulate(rows,p);lastSimulation=s;trans.textContent=s.transitions;def.textContent=s.defenseDays;changed.textContent=s.rows.filter(r=>r.research_leverage!==r.frozen_leverage).length;rcagr.textContent=pct(s.metrics.cagr);bcagr.textContent=pct(s.baselineMetrics.cagr);rdd.textContent=pct(s.metrics.maxDrawdown);bdd.textContent=pct(s.baselineMetrics.maxDrawdown);rvol.textContent=pct(s.metrics.volatility);rsh.textContent=s.metrics.sharpeLike==null?'—':s.metrics.sharpeLike.toFixed(2);const c=chart,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!s.rows.length)return;const step=c.width/Math.max(1,s.rows.length-1);[['frozen_leverage','#64748b'],['research_leverage','#60a5fa']].forEach(([k,col])=>{x.strokeStyle=col;x.beginPath();s.rows.forEach((r,i)=>{const y=c.height-30-r[k]*70;i?x.lineTo(i*step,y):x.moveTo(0,y)});x.stroke()})}
if(d.rows.length){from.value=d.rows[0].date;to.value=d.rows.at(-1).date}from.onchange=to.onchange=draw;preset.onchange=()=>{const y=+preset.value;if(!y){from.value=d.rows[0].date}else{const z=new Date(to.value);z.setFullYear(z.getFullYear()-y);from.value=z.toISOString().slice(0,10)}draw()};defs.forEach(([k])=>document.getElementById(k).oninput=e=>{p[k]=+e.target.value;document.getElementById('v-'+k).textContent=p[k];draw()});vixFilter.onchange=e=>{p.vixFilter=e.target.value?+e.target.value:null;draw()};saveExp.onclick=()=>{if(!lastSimulation)return;const xs=JSON.parse(localStorage.sl_research_experiments||'[]');xs.push({name:expName.value||'Untitled experiment',from:from.value,to:to.value,params:{...p},metrics:lastSimulation.metrics,baseline:lastSimulation.baselineMetrics,savedAt:new Date().toISOString()});localStorage.sl_research_experiments=JSON.stringify(xs.slice(-50));renderSaved()};renderSaved();draw();</script></body></html>
